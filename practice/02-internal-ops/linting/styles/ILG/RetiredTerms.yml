extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
# Retired axiom names. The canonical names live in
# theory/01-foundation/00-ilg-constitution.md Part I. Add a row here whenever an
# axiom is renamed, in the same commit as the Constitution version bump.
#
# The list below was completed by mining git history rather than by scanning the
# working tree, because a name fully purged before this rule existed leaves no
# trace to find. See the linting README for the command.
#
# Deliberately absent: "Law of Conservation". That is Tesler's Law quoted in
# prose in a published style reference, not a retired ILG axiom.
#
# Retired directory numbering. These paths never resolve; they appear in link
# text while the href alongside them is correct, so the link checker cannot see
# them. Add a row here whenever a directory is renumbered.
#
# Retired deal analogies (v14.0). Replaced by Structural Deal ($k \ge 10$) and
# Turnkey Deal ($k \le 9$) per the 2x2 Deal Archetype Matrix.
# Metric name. NRR is Net Revenue Retention, confirmed 2026-09. The expansion
# below is a common slip and has never appeared in the working tree, so this row
# is preventive rather than corrective, in the same spirit as the entries mined
# from git history above. Canonical definition: 04-glossary-and-notation.md.
# Retired Constitution sections (v15.0). Clarifying Concepts was deleted as a
# third home for definitions that already had a research file and a glossary
# row. Part IV moved to practice/02-internal-ops/07-variable-ownership.md. Both
# names survive only inside link text, where hrefs stay valid and the link
# checker cannot see the staleness. Keys are scoped to the link-text shape on
# purpose, the way the v14.0 analogies avoid bare "Bridge" and "Toaster", so the
# Constitution's own version history can still name what it retired.
swap:
  Constitution, Clarifying Concepts: the concept's research file, indexed in 04-glossary-and-notation.md
  Constitution clarifying concept: the concept's research file, indexed in 04-glossary-and-notation.md
  Constitution, Part IV: practice/02-internal-ops/07-variable-ownership.md
  net recurring revenue: Net Revenue Retention
  Net Recurring Revenue: Net Revenue Retention
  net retained revenue: Net Revenue Retention
  Net Retained Revenue: Net Revenue Retention
  Law of Economic Boundaries: Law of Transaction Cost Composition
  Law of Friction: Law of Uncertainty Inflation
  Law of Asymmetry Convergence: Law of Uncertainty Inflation
  Law of Bilateral Governance: Law of Governance
  Law of Aligned Adjudication: Law of Governance
  Law of Commercial Friction: Law of Transaction Cost Composition
  Law of The Boundary: "the Boundary Condition (Axiom I), or the Workflow Maturity Gate for the workflow-definition half"
  Law of Prospective Hindsight: "the Red Team protocol (the framework has three axioms, not six)"
  n_viable: "k > k_threshold and F_deployed ~ k (the v13 boundary condition)"
  n_max: "k > k_threshold and F_deployed ~ k (the v13 boundary condition)"
  03-field-assets: 01-field-assets
