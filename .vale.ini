StylesPath = practice/02-internal-ops/linting/styles
MinAlertLevel = warning

# Most of this repo is reference and operational material, so the higher
# punctuation budget is the default. Prose written for publication opts back
# into the short-form limit below.
# See practice/02-internal-ops/linting/README.md for why the two differ.
[*.md]
BasedOnStyles = ILG
ILG.Punctuation = NO
ILG.PunctuationReference = YES

[publishing/02-tools/style-references/**]
ILG.Punctuation = YES
ILG.PunctuationReference = NO

[publishing/03-drafts/**]
ILG.Punctuation = YES
ILG.PunctuationReference = NO
