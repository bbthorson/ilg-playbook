<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Axiom II: perceived cost is convex in uncertainty</title>
<desc id="figdesc">Perceived transaction cost plotted against the normalized bilateral asymmetry gap. The list-price curve is convex, rising slowly at a narrow gap and steeply at a wide one. A deep discount shifts the whole curve downward by a constant amount without changing its shape. A dashed straight line shows what a linear cost of uncertainty would look like instead. At a wide gap a bracket marks the vertical distance between the discounted price and the discounted curve: the share of perceived cost that comes from uncertainty, which no price concession removes.</desc>
